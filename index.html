<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wolds Farm 3D Map</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.139/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.139/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  >

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>

  <script>
    async function init() {
      const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        geocoder: false
      });
  
      const tileset = await Cesium.Cesium3DTileset.fromUrl(
        "https://deadb33f.github.io/wolds.farm/tiles/tileset.json"
      );
  
      viewer.scene.primitives.add(tileset);
  
      await viewer.zoomTo(tileset);
    }
  
    init();
  </script>
</body>
</html>
