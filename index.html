<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CesiumJS Globe - OSM Base Map</title>

  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Floating control panel styling */
    #toolbar {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: rgba(42, 42, 42, 0.85);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      display: flex;
      gap: 8px;
    }

    button {
      background-color: #3880ff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1e66e5;
    }

    button.active {
      background-color: #10439b;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="perspectiveBtn" class="active" onclick="setPerspective()">Perspective View</button>
    <button id="orthographicBtn" onclick="setOrthographic()">Orthographic View</button>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = '';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      // Use 'baseLayer' instead of 'imageryProvider' for modern Cesium versions
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
          credit: '© OpenStreetMap contributors',
          maximumLevel: 19 // OSM tiles only go up to zoom level 19
        })
      ),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      animation: false,
      navigationHelpButton: false
    });

    const camera = viewer.camera;
    const perspectiveBtn = document.getElementById('perspectiveBtn');
    const orthographicBtn = document.getElementById('orthographicBtn');

    function setPerspective() {
      camera.switchToPerspectiveFrustum();
      perspectiveBtn.classList.add('active');
      orthographicBtn.classList.remove('active');
    }

    function setOrthographic() {
      camera.switchToOrthographicFrustum();
      orthographicBtn.classList.add('active');
      perspectiveBtn.classList.remove('active');
    }
	
	async function loadWebODMTileset() {
  const tilesetUrl = 'tileset/tileset.json';

  try {
    // 1. Load the 3D tileset asynchronously
    const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
	viewer.scene.primitives.add(tileset);


	const center = tileset.boundingSphere.center;
    const enuToFixed = Cesium.Transforms.eastNorthUpToFixedFrame(center);

	// Get the inverse to go from ECEF (Globe) space to Local space
	const fixedToEnu = Cesium.Matrix4.inverseTransformation(enuToFixed, new Cesium.Matrix4());

	// Define the 90-degree rotation around the local X-axis
	const angle = Cesium.Math.toRadians(-90.0); // Try -90.0 if it flips upside down!
	const localRotation = Cesium.Matrix4.fromRotationTranslation(
	  Cesium.Matrix3.fromRotationX(angle) 
	);

	// Combine the matrices: Localize -> Rotate -> Send back to Globe space
	let modelMatrix = Cesium.Matrix4.multiply(enuToFixed, localRotation, new Cesium.Matrix4());
	modelMatrix = Cesium.Matrix4.multiply(modelMatrix, fixedToEnu, modelMatrix);

	// Apply the fix to the tileset
	tileset.modelMatrix = modelMatrix;
	
	// 2. Add the tileset to the scene
    
    // 3. Center and position camera over the model
    await viewer.zoomTo(
      tileset, 
      new Cesium.HeadingPitchRange(
        Cesium.Math.toRadians(0),   // Heading (North)
        Cesium.Math.toRadians(-45), // Pitch (45° angle look-down)
        0                           // Range (0 auto-fits distance to model extent)
      )
    );
  } catch (error) {
    console.error('Error loading 3D tileset:', error);
  }
}

loadWebODMTileset();

  </script>
</body>
</html>
